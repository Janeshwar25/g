services:
  app:
    build: .
    ports:
      - "8080:8080"  # FastAPI
      - "8501:8501"  # Streamlit
    volumes:
      - ./documents:/app/documents
      - ./upload:/app/upload
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      # API Keys
      - AHA_API_KEY=${AHA_API_KEY:-}
      - ICARUS_API_KEY=${ICARUS_API_KEY:-}
      - SMARTSHEET_API_KEY=${SMARTSHEET_API_KEY:-}
      - RALLY_API_KEY=${RALLY_API_KEY:-}
      - ACCELQ_API_KEY=${ACCELQ_API_KEY:-}
      # Service URLs
      - RALLY_URL=${RALLY_URL:-}
      - AHA_BASE_URL=${AHA_BASE_URL:-}
      - SMARTSHEET_BASE_URL=${SMARTSHEET_BASE_URL:-}
      - ICARUS_BASE_URL=${ICARUS_BASE_URL:-}
      # Application Configuration
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8080}
      - STREAMLIT_HOST=${STREAMLIT_HOST:-0.0.0.0}
      - STREAMLIT_PORT=${STREAMLIT_PORT:-8501}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8080}
      # Workspace Configuration
      - RALLY_WORKSPACE=${RALLY_WORKSPACE:-}
      - RALLY_PROJECT=${RALLY_PROJECT:-}
      - SMARTSHEET_WORKSPACE_ID=${SMARTSHEET_WORKSPACE_ID:-}
      # Other Configuration
      - METADATA_FILE=${METADATA_FILE:-}
      - TEMPLATE_FILE=${TEMPLATE_FILE:-}
      - DEFAULT_BDL=${DEFAULT_BDL:-}
      - DEFAULT_RDL=${DEFAULT_RDL:-}
      - DEFAULT_BUSINESS_OWNER=${DEFAULT_BUSINESS_OWNER:-}
      - BUTTON_COLOR=${BUTTON_COLOR:-}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-}
      # MongoDB Configuration
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb-service:27017}
      - MONGODB_USERNAME=${MONGODB_USERNAME:-}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD:-}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-project_plans}
      - MONGODB_COLLECTION=${MONGODB_COLLECTION:-plan_metadata}
    env_file:
      - credentials.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s